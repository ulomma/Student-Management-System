services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: student-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - student-data:/app/data

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: student-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  student-data: